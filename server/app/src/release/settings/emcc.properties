# emcc's settings (ADR-0060). The server reads this file at every start, from the settings folder of the folder it runs
# in (the emcc folder). Each line is name=value. A line that starts with # is a comment: the settings below that are
# commented out show their default; remove the # and change the value to set one.
#
# Where settings come from, a later one winning over an earlier one:
#   1. emcc's defaults;
#   2. application-local.properties next to the start script (deprecated: move its lines here and its secrets to
#      settings/credentials/; the server warns while it is there);
#   3. this file;
#   4. the files in settings/credentials/, one per credential (passwords, secrets, tokens), readable only by the
#      account emcc runs as and by administrators;
#   5. environment variables (the name in capitals, dots and dashes as _, e.g. EMC2_LIVE_MAX_SESSIONS);
#   6. what the start script puts on its command line (e.g. the port, the login mode, the Keycloak address).
#
# Never put a password, secret or token in this file: they go in settings/credentials/.
# A path may start with %emcc%/ : it is then below the emcc folder, e.g. %emcc%/settings/credentials/tak.p12.
# A relative path without it is below the folder the server runs in, which is the emcc folder too.
# This file is read as Latin-1: write other characters as \u and four hex digits (· is the middle dot).


# ---------------------------------------------------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------------------------------------------------

# The HTTP port, or the HTTPS port once a certificate is set. The start script sets it on its command line, which
# wins over this line.
# server.port=8080

# HTTPS (ADR-0061): on when settings/credentials/https.properties names the certificate (https-example.properties
# there); plain HTTP is then off on server.port. Its password never goes in this file. The server then sets the
# line below by itself; leave it unset.
# server.ssl.bundle=emcc
# An optional second port that only redirects browsers to HTTPS (307), e.g. 80 or 8081. Empty: off. It needs HTTPS.
# emc2.https.redirect-port=
# HSTS over HTTPS: browsers keep to HTTPS for this host for so many seconds (one year); 0 sends none. With a test
# certificate a browser does not trust, a long time can lock that browser out of the host name: test with a short one.
# emc2.https.hsts-max-age=31536000

# The address the server listens on. Unset: every address of this computer in login mode, loopback only without
# login. Example: 127.0.0.1 (this computer only), or 0.0.0.0 (every address).
# server.address=

# Host names, besides localhost, 127.0.0.1, [::1] and server.address, under which browsers may open emcc
# (comma-separated; against DNS rebinding). Set it when users reach the server by another name.
# Example: emc2.allowed-hosts=emcc.example.org,emcc
# emc2.allowed-hosts=

# Behind a reverse proxy: native takes the browser's host name, address and https from the proxy's X-Forwarded-*
# headers (the name must then be in emc2.allowed-hosts); none ignores them. No other value is accepted.
# server.forward-headers-strategy=none

# With server.forward-headers-strategy=native: the proxies trusted to send X-Forwarded-*, as a regular expression of
# their addresses. It must be set then, or the server does not start. Example: 10\\.0\\.0\\.5
# server.tomcat.remoteip.internal-proxies=

# The login session ends after this long without a request (the open page keeps it alive). Unit: m (minutes) or h.
# server.servlet.session.timeout=30m


# ---------------------------------------------------------------------------------------------------------------------
# Login (ADR-0022)
# ---------------------------------------------------------------------------------------------------------------------

# oidc: users log in at an OpenID Connect IAM such as Keycloak. none: no login, one local user with every
# permission, on this computer only; a warning at every start. The start script sets it on its command line.
# emc2.login.mode=oidc

# Without login: true also listens on addresses other than loopback, so that anyone on the network has every
# permission. Only for a closed test network.
# emc2.login.no-login.allow-network=false

# The IAM's issuer, e.g. https://keycloak.example.org/realms/emcc. The start script sets it from its Keycloak and
# realm, which wins over this line.
# emc2.login.oidc.issuer-uri=

# emcc's client id at the IAM.
emc2.login.oidc.client-id=emc2

# The client secret goes in settings/credentials/login.properties, never here:
#   emc2.login.oidc.client-secret

# The scopes asked for at login; openid is always added.
# emc2.login.oidc.scopes=openid,profile

# The token claim that holds the user's groups or roles.
emc2.login.oidc.roles-claim=groups

# Which groups (or roles) give each permission: emc2.login.oidc.permissions[<permission>]=<group>,<group>.
# Everyone who logs in may see the map (core.view); * gives a permission to every logged-in user.
# These are the groups of the demo realm emc2-demo.
emc2.login.oidc.permissions[objects.edit]=drawers,editors,admins
emc2.login.oidc.permissions[layers.edit]=editors,admins
emc2.login.oidc.permissions[settings.admin]=admins
emc2.login.oidc.permissions[plugin.simulator.view]=sim-viewers
emc2.login.oidc.permissions[plugin.simulator.edit]=sim-editors
emc2.login.oidc.permissions[plugin.simulator.run]=sim-runners
emc2.login.oidc.permissions[plugin.uav-simulation.view]=sim-viewers
emc2.login.oidc.permissions[plugin.uav-simulation.edit]=sim-editors
emc2.login.oidc.permissions[plugin.uav-simulation.run]=sim-runners
emc2.login.oidc.permissions[plugin.terrain.use]=drawers,editors,admins
emc2.login.oidc.permissions[plugin.fmv.view]=*

# Where the IAM sends a back-channel logout: by default emcc's own address as the IAM called it. Behind a reverse
# proxy better a loopback address. Example: http://127.0.0.1:8080/logout
# emc2.login.oidc.back-channel-logout-uri={baseUrl}/logout


# ---------------------------------------------------------------------------------------------------------------------
# Credentials (ADR-0060)
# ---------------------------------------------------------------------------------------------------------------------

# A credentials file that other users of this computer can read gets a warning at every start; true refuses to
# start instead.
# emc2.credentials.require-private=false


# ---------------------------------------------------------------------------------------------------------------------
# Folders
# ---------------------------------------------------------------------------------------------------------------------

# Where emcc keeps the live picture (snapshot.json, journal.jsonl) and its settings from the Settings workspace.
# emc2.data.directory=data

# The installed plugins.
# emc2.plugins.directory=plugins

# The web client's files.
# emc2.web.root=web/shell/dist

# The release's own folder, which holds version.properties (the version the Help menu shows) and the user manual
# (manual/, served at /manual/). Read at start. Empty: the emcc folder; leave it so.
# emc2.release.directory=


# ---------------------------------------------------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------------------------------------------------

# The log file; it rolls at max-file-size, and the old files are kept max-history days, at most total-size-cap.
logging.file.name=logs/emcc.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=280MB

# One part's level: TRACE, DEBUG, INFO, WARN or ERROR. A plugin's logger is plugin.<id>. Example:
# logging.level.plugin.cot=DEBUG


# ---------------------------------------------------------------------------------------------------------------------
# The live picture
# ---------------------------------------------------------------------------------------------------------------------

# How many browsers may have the live picture open at a time. Above, a new one is asked to try again later.
# emc2.live.max-sessions=200

# The most objects one browser gets one by one in its view; above, the area is sent as clusters.
# emc2.live.max-budget=100000

# A browser connection from which nothing arrives for this long is closed. Unit: s or m.
# emc2.live.idle-timeout=2m


# ---------------------------------------------------------------------------------------------------------------------
# Security labels
# ---------------------------------------------------------------------------------------------------------------------

# The default label, e.g. of the "Default" layer emcc creates in an empty store.
# emc2.default-label.policy=NATO
# emc2.default-label.classification=UNCLASSIFIED

# Each policy's classifications, lowest first: emc2.classifications.order.<policy>=<lowest>,...,<highest>.
# One line per policy.
# emc2.classifications.order.NATO=UNCLASSIFIED,RESTRICTED,CONFIDENTIAL,SECRET,COSMIC TOP SECRET

# Settings > Labeling's classification sets and policies: a JSON file (comments allowed) that replaces emcc's own
# whole. Unset: labeling-definitions.local.json in the emcc folder if it is there, else emcc's own.
# Example: emc2.labeling.definitions=%emcc%/settings/labeling-definitions.json
# emc2.labeling.definitions=

# How a premade label is written as text, e.g. NATO SECRET · REL TO SWE, NOR: the separator after the
# classification, between the Releasable To values, and the Releasable To prefix. In double quotes, spaces count.
# emc2.labeling.field-separator=" · "
# emc2.labeling.releasable-to-separator=", "
# emc2.labeling.releasable-to-prefix="REL TO"


# ---------------------------------------------------------------------------------------------------------------------
# Plugins' limits
# ---------------------------------------------------------------------------------------------------------------------

# Per plugin: the asks waiting for an answer, and the active timers. One more is refused.
# emc2.plugins.max-outstanding-asks=10000
# emc2.plugins.max-active-timers=1000

# Per plugin: the most listeners, connection tasks (child tasks included) and output channels.
# emc2.listeners.max-per-plugin=100
# emc2.connections.max-per-plugin=100
# emc2.channels.max-per-plugin=100

# TLS credentials for listeners and connections go in settings/credentials/ (tls-example.properties), never here:
#   emc2.tls.<name>.trust-store, .certificate and .private-key (PEM) or .key-store, with types and passwords (ADR-0062)

# Bearer tokens for plugins' HTTP calls go in settings/credentials/ (http-example.properties), never here:
#   emc2.http.credentials.<name>.token


# ---------------------------------------------------------------------------------------------------------------------
# Video streams and conversions
# ---------------------------------------------------------------------------------------------------------------------

# Per stream, the bytes kept since its last start point for a new viewer; per viewer, the bytes it may have waiting
# before it skips to the next start point; the most viewers of one stream, and of all streams together.
# emc2.streams.start-buffer-bytes=16777216
# emc2.streams.viewer-queue-bytes=4194304
# emc2.streams.viewers-per-stream=8
# emc2.streams.viewers=32

# MPEG-2 to H.264 conversions: how many run at once (about half a core each), and the most input that waits for one.
# emc2.conversions.max=2
# emc2.conversions.input-queue-bytes=2097152

# The converter. Unset: the release's own, tools/ffmpeg/ffmpeg.exe. An ffmpeg of your own works too, if it has the
# h264_mf encoder, the mpeg2video decoder and mpegts (both ways): emcc checks it at start and logs its version, or why
# every conversion fails as "unavailable". It runs with an empty environment, so a build that needs PATH or
# LD_LIBRARY_PATH for its libraries does not run (the check says "did not answer"). Without it nothing else stops.
# Example: emc2.conversions.ffmpeg=C:/ffmpeg/bin/ffmpeg.exe
# emc2.conversions.ffmpeg=

# The largest picture a conversion decodes, in pixels (307200 to 35000000; 8294400 is 3840 x 2160). A larger one
# fails instead of taking gigabytes of memory.
# emc2.conversions.max-pixels=8294400

# The least time, in seconds (1 to 600), between two starts of the converter for one video; a start inside it waits.
# emc2.conversions.restart-seconds=10

# ---- Compute threads ----
# The most compute tasks all plugins may run at once (1 to 1024), for plugins that render or compute without end,
# such as a simulated camera. Empty is the computer's cores minus one. Each plugin's own number, at most what it
# declares, is set in its Settings entry while it runs; the Monitor shows both. Read at start.
# emc2.compute.max-threads=


# ---------------------------------------------------------------------------------------------------------------------
# Monitor
# ---------------------------------------------------------------------------------------------------------------------

# The Monitor's allocation line: false switches off the sampling of emcc's own share (the total stays).
# emc2.monitor.allocation=true
