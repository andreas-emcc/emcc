# A bearer token for plugins' HTTP calls (ADR-0060), one file per name: copy this file to http-<name>.properties, e.g.
# http-weather.properties, and set the line with that name. A plugin's call that names a credential gets its token;
# a name that is not set fails the call at once with "no credential <name>". Only the account emcc runs as and
# administrators may read this folder's files.
# emc2.http.credentials.<name>.token=
