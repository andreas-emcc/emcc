# The server's own HTTPS certificate (ADR-0061): copy this file to https.properties in this folder and set one of the
# two forms below. The certificate's files are best kept in this folder too. Only the account emcc runs as and
# administrators may read this folder's files. Without https.properties the server serves plain HTTP.
# A renewed certificate (the same files replaced) applies without a restart. TLS 1.3 and 1.2 only.
#
# PKCS#12 (.p12, .pfx; recommended) or JKS. The alias is needed only when the store holds more than one key.
# spring.ssl.bundle.jks.emcc.keystore.location=%emcc%/settings/credentials/emcc-server.p12
# spring.ssl.bundle.jks.emcc.keystore.password=
# spring.ssl.bundle.jks.emcc.keystore.type=PKCS12
# spring.ssl.bundle.jks.emcc.key.alias=
#
# Or PEM: the certificate chain (the server's certificate first) and its private key; the key's password only if it
# is encrypted.
# spring.ssl.bundle.pem.emcc.keystore.certificate=%emcc%/settings/credentials/emcc-server.pem
# spring.ssl.bundle.pem.emcc.keystore.private-key=%emcc%/settings/credentials/emcc-server.key
# spring.ssl.bundle.pem.emcc.keystore.private-key-password=
#
# Users' browsers must trust the certificate's issuer. The login's IAM must accept https:// redirects for emcc.
