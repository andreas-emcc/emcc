# A TLS credential for plugins' listeners and connections (ADR-0060, ADR-0062), one file per name: copy this file to
# tls-<name>.properties, e.g. tls-tak.properties, and set the lines with that name. A link picks the credential by its
# name in Settings; a link that picks none uses the credential named as the link. The files are best kept in this
# folder: %emcc%/settings/credentials/tak-ca.pem. Only the account emcc runs as and administrators may read this
# folder's files. The files are read when the server starts: a changed credential needs a restart.
#
# A store's type is PKCS12, JKS or PEM; without a type line it goes by the file's extension: .jks is JKS, .pem, .crt
# and .cer are PEM, any other PKCS12.
#
# The trust store: the certificates of the other ends' authorities. A PEM file has no password.
# emc2.tls.<name>.trust-store=%emcc%/settings/credentials/<name>-ca.pem
# emc2.tls.<name>.trust-store-type=PEM
# emc2.tls.<name>.trust-store-password=          (PKCS12 and JKS only)
#
# This end's certificate and key, only where the other end asks for a client certificate. Either PEM files, as
# TAK Server's tools give them: the certificate chain (this end's certificate first) and its private key
# (PKCS #8, plain or encrypted, or an unencrypted RSA or EC key):
# emc2.tls.<name>.key-store-type=PEM
# emc2.tls.<name>.certificate=%emcc%/settings/credentials/<name>.pem
# emc2.tls.<name>.private-key=%emcc%/settings/credentials/<name>.key
# emc2.tls.<name>.private-key-password=          (only if the key is encrypted)
# or a key store:
# emc2.tls.<name>.key-store=%emcc%/settings/credentials/<name>.p12
# emc2.tls.<name>.key-store-type=PKCS12
# emc2.tls.<name>.key-store-password=
#
# Deprecated: the keys before ADR-0062 are still read, with a warning at every start; emc2.tls.<name> wins where both
# name a credential. Move them to the keys above.
# emc2.listeners.credentials.<name>.trust-store=
# emc2.listeners.credentials.<name>.trust-store-password=
# emc2.listeners.credentials.<name>.key-store=
# emc2.listeners.credentials.<name>.key-store-password=
