# emc2 server configuration: the defaults. An installation changes them in its settings files (ADR-0060,
# server/README.md "Settings files"), read from the folder the server runs in, later ones winning:
# application-local.properties (deprecated), settings/emcc.properties, settings/credentials/*.properties;
# environment variables and the command line win over all. The release's settings/emcc.properties lists
# every key with its comment (server/app/src/release/settings/).
# The application's name in Spring's own logs; fixed.
spring.application.name=emc2
# The HTTP port.
server.port=8080
# At a stop the web server finishes the requests in progress before ECore stops (also Spring
# Boot's default; stated because the development stop endpoint relies on it).
server.shutdown=graceful

# How users log in (ADR-0022): oidc (login with OpenID Connect, the default) or none (no login:
# one local user with all permissions, a warning at every start, on this computer only unless
# emc2.login.no-login.allow-network=true). Never a silent fallback: if login cannot work, the
# server does not start. The development profile "dev" sets none.
emc2.login.mode=oidc
emc2.login.no-login.allow-network=false

# Login with OpenID Connect (mode oidc; server/README.md). Set in local configuration, never here:
# emc2.login.oidc.issuer-uri, emc2.login.oidc.client-id and emc2.login.oidc.client-secret.
# emc2.login.oidc.roles-claim names the claim with the user's roles or groups (default groups), and
# emc2.login.oidc.permissions[<permission>]=<role>,<role> gives permissions to them.

# The credentials files (ADR-0060 point 3): one that other users of the computer can read gets a warning
# at every start; true refuses to start instead.
emc2.credentials.require-private=false

# The login session's cookie (ADR-0022): not readable by scripts, not sent with requests from other
# sites; Tomcat marks it Secure when the page came over HTTPS. The shell keeps the session alive
# while the page is open (GET /api/session every minute).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Users come from the IAM or are the no-login mode's local user, never from Spring Boot's
# generated in-memory user (which would also log a generated password).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Folder with the built web client. Relative paths are resolved against the working directory
# (the repository root when started with node tools/start.mjs).
emc2.web.root=web/shell/dist

# Compress text answers (the web client's scripts and styles, JSON) for browsers that accept it.
# The live picture's WebSocket is compressed by Tomcat's permessage-deflate.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml

# The live socket's read buffer, in characters: the handler takes messages in parts of at most this
# and checks the 1 MiB limit itself (LiveWebSocketHandler.MAX_MESSAGE), after reading the whole
# message, so that its 1009 always reaches the browser.
server.servlet.context-parameters.org.apache.tomcat.websocket.textBufferSize=1048576

# Static files are served only from emc2.web.root (see WebClientConfiguration).
spring.web.resources.add-mappings=false
# No endpoint takes uploads: without this, Spring would read a whole multipart body (up to 10 MB)
# before any controller decides on the request (CR-0026: a plugin POST reads at most its maxBody).
spring.servlet.multipart.enabled=false
# Nor forms: Spring's FormContentFilter would read a PUT, PATCH or DELETE form body whole, unbounded.
spring.mvc.formcontent.filter.enabled=false

# Where the file store keeps the live picture (snapshot.json, journal.jsonl). Relative paths are
# resolved against the working directory; /data/ at the repository root is ignored by git.
emc2.data.directory=data

# The installed plugins: <id>/plugin.json, <id>/server/*.jar, <id>/web/ (overview 4.1). Folders
# whose names start with _ (the template) or . are skipped. A missing folder means no plugins.
emc2.plugins.directory=plugins

# Caps per plugin (CR-0005), so that one plugin cannot fill ECore's scheduler: asks waiting for an
# answer (one more is answered at once with "too many outstanding asks") and active timers (one more
# makes once/every throw IllegalStateException). Refusals are logged at most once a minute per plugin.
emc2.plugins.max-outstanding-asks=10000
emc2.plugins.max-active-timers=1000
# Plugins' listeners (SDK v1): the most per plugin. TLS credentials by name go in a credentials file only
# (settings/credentials/tls-<name>.properties, ADR-0062): emc2.tls.<name>.trust-store, .certificate, .private-key, ...
emc2.listeners.max-per-plugin=100
# Plugins' connection tasks (SDK 1.2.0, ADR-0036): the most one plugin may run at a time, child
# tasks included. TLS credentials are the listeners' (emc2.tls.<name>), shared.
emc2.connections.max-per-plugin=100
# Plugins' output channels (SDK 1.2.0, ADR-0037): the most one plugin may offer at a time, one per
# output link. One more makes offer throw IllegalStateException.
emc2.channels.max-per-plugin=100
# SDK 1.8.0 (CR-0044 E1): the streams from plugins to their web parts. Per stream, the bytes kept since
# the last start point for new viewers; per viewer, the bytes it may have waiting before it loses them
# and resumes at the next start point; the most viewers of one stream, and of all streams together.
emc2.streams.start-buffer-bytes=16777216
emc2.streams.viewer-queue-bytes=4194304
emc2.streams.viewers-per-stream=8
emc2.streams.viewers=32
# SDK 1.8.0 (CR-0044 E2, CR-0045, T-211): ECore's conversion service. How many conversions run at once (about half a core
# each), the most input that waits for one, and the converter: empty is the release's tools/ffmpeg/ffmpeg.exe (Windows) or
# tools/ffmpeg/ffmpeg, below the working directory. Without it, every conversion fails as "unavailable"; nothing else stops.
emc2.conversions.max=2
emc2.conversions.input-queue-bytes=2097152
emc2.conversions.ffmpeg=
# The largest picture a conversion decodes, in pixels (307200 to 35000000; 8294400 is 3840 x 2160). An input whose
# header claims a larger one gives no output and fails as "start" after 10 s, instead of taking gigabytes (SRA, M8).
emc2.conversions.max-pixels=8294400
# The least time, in seconds (1 to 600), between two launches of the converter for one plugin's stream; a start inside
# it waits (M9 C5). At start the converter is checked once: its version is logged, and one without the h264_mf encoder,
# the mpeg2video decoder or mpegts makes every conversion fail as "unavailable" (an admin's own ffmpeg, CR-0045).
emc2.conversions.restart-seconds=10
# The most compute tasks of all plugins together (SDK 1.9.0, ADR-0064), 1 to 1024, read at start; empty is the
# computer's cores minus one, at least one. A plugin's own number is set in its Settings entry.
emc2.compute.max-threads=
# Plugins' outbound HTTP (SDK 1.6.0, CR-0041 part A): a call's bearer token by the name its
# HttpCall.credential gives, shared by name, in a credentials file only (settings/credentials/), never here:
# emc2.http.credentials.<name>.token (or EMC2_HTTP_CREDENTIALS_<NAME>_TOKEN). A name that is not
# configured fails the call at once with "no credential <name>".

# The Monitor's allocation line (T-148, spike S5): the JVM's total allocation rate always, and
# ECore's share from JFR's allocation samples inside the server (150 a second, at most ~0.3 % of one
# core). false switches JFR off; the Monitor then shows the total only.
emc2.monitor.allocation=true

# Host names, besides localhost, 127.0.0.1, [::1] and server.address, under which browsers may open
# the live picture (comma-separated; against DNS rebinding). Set it when the server is reached by
# another name, e.g. with --server.address=0.0.0.0: --emc2.allowed-hosts=my-machine.example
emc2.allowed-hosts=

# How many browsers may have the live picture open at a time (WebSocket /api/live). Above, a new
# connection is closed with status 1013 (try again later).
emc2.live.max-sessions=200

# The most objects one live picture subscription gets individually (its budget is capped by this, and
# a subscription that names none gets it). Above, the area is sent as clusters (spike S3).
emc2.live.max-budget=100000

# A live picture connection from which nothing arrives for this long is closed. The server pings
# every browser every 30 s, and browsers answer by themselves, so this only ends dead connections.
emc2.live.idle-timeout=2m

# The default security label (overview 4.9), e.g. for the "Default" layer ECore creates in an
# empty store. M0 configures policy and classification only.
emc2.default-label.policy=NATO
emc2.default-label.classification=UNCLASSIFIED

# The order of each security policy's classifications, lowest first (ADR-0031 point 3): Settings >
# Layers offers a layer the classifications of its policy's order and raises objects lower in it.
# A policy without an order is shown read only there. More policies: one line each.
emc2.classifications.order.NATO=UNCLASSIFIED,RESTRICTED,CONFIDENTIAL,SECRET,COSMIC TOP SECRET

# Settings > Labeling's classification sets and policies (T-170): labeling-definitions.json beside
# this file, replaced whole by labeling-definitions.local.json in the working directory (ignored by
# git) or by the file this key names. Its syntax: server/README.md, "Premade security labels".
# emc2.labeling.definitions=C:/emcc/labeling-definitions.json

# How a premade label of Settings > Labeling is written as text (T-170), e.g.
#   NATO SECRET \u00B7 REL TO SWE, NOR, FIN
# the policy and the classification with a space between, then the field separator, then the
# Releasable To prefix, a space and the values with the Releasable To separator between them. A label
# released to none ends after its classification.
# Syntax: put the value in double quotes; the text between the first and the last quote is taken as
# it is, spaces at its start and end included. Without quotes, spaces at the ends are dropped.
# This file is read as Latin-1: write other characters as a backslash, u and four hex digits
# (\u00B7 is the middle dot). Each can be changed in settings/emcc.properties.
emc2.labeling.field-separator=" \u00B7 "
emc2.labeling.releasable-to-separator=", "
emc2.labeling.releasable-to-prefix="REL TO"
