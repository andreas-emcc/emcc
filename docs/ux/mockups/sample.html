<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>emcc mockup · One palette</title>
<link rel="stylesheet" href="../../../web/shell/src/tokens.css">
<link rel="stylesheet" href="../../../web/plugin-sdk/src/components/components.css">
<link rel="stylesheet" href="directions.css">
<link rel="stylesheet" href="mock.css">
<script src="mock.js"></script>
<style>
  body { padding: 10px; gap: 10px; overflow: auto; }
  h2 { font: var(--ux-head-weight) 1.15em var(--emc2-font-heading); text-transform: var(--emc2-heading-case); letter-spacing: var(--emc2-heading-letter-spacing); }
  .sw { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .sw > div { padding: 5px 7px; border: 1px solid var(--emc2-color-border); font-size: var(--emc2-size-text-small); }
  .sw code { display: block; font-family: var(--emc2-font-data); }
  .box { background: var(--emc2-color-pane); border: var(--ux-edge-w) solid var(--ux-edge); border-radius: var(--emc2-radius); }
  .box > header { padding: 5px 8px; background: var(--emc2-color-panel); border-bottom: 1px solid var(--emc2-color-border); }
  .box > div { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .fix i { display: inline-block; width: 26px; height: 18px; border: 2px solid #111; vertical-align: middle; }
  table { border-collapse: collapse; width: 100%; font-size: var(--emc2-size-text-small); }
  td { padding: 2px 4px; border-bottom: 1px solid var(--emc2-color-border); }
  td.n { text-align: right; font-family: var(--emc2-font-data); }
  .bad { color: var(--emc2-color-error); font-weight: 700; }
</style>
</head>
<body>
<h2 id="name"></h2>

<div class="sw" id="sw"></div>

<div class="box">
  <header class="ux-row"><i data-i="sliders"></i><b class="ux-title ux-grow">Panel head</b><span class="ux-muted ux-small">muted</span></header>
  <div>
    <div class="ux-row"><button class="emc2-button emc2-button-primary">Save</button><button class="emc2-button">Discard</button><button class="emc2-button emc2-button-danger">Delete</button><button class="emc2-button" disabled>Off</button></div>
    <div class="emc2-tabs"><button class="emc2-tab emc2-tab-active">Active</button><button class="emc2-tab">Other</button></div>
    <label class="emc2-field"><span class="emc2-field-label">Field label</span><input class="emc2-input" value="Text in a field" style="outline:var(--emc2-focus-width) solid var(--emc2-focus-color);outline-offset:var(--emc2-focus-offset)"></label>
    <div>
      <div class="emc2-list-row">A row <span class="ux-muted">with muted text</span></div>
      <div class="emc2-list-row emc2-list-row-selected" style="box-shadow:inset 3px 0 0 var(--emc2-color-accent)">Selected row <span class="ux-muted">muted</span> <span style="color:var(--emc2-color-accent)">accent</span></div>
    </div>
    <div class="ux-row" style="flex-wrap:wrap"><span class="ux-chip ux-ok"><i data-i="ok"></i>OK</span><span class="ux-chip ux-warn"><i data-i="warn"></i>Warning</span><span class="ux-chip ux-err"><i data-i="warn"></i>Error</span><span class="ux-chip ux-off"><i data-i="off"></i>Off</span><span class="ux-count">3</span></div>
    <div class="fix ux-small">Fixed on the map, beside the accent:<br>
      <i style="background:#80e0ff"></i> <i style="background:#ff8080"></i> <i style="background:#aaffaa"></i> <i style="background:#ffff80"></i> <i style="background:#ffd400"></i> <i style="background:var(--emc2-color-accent);border-color:transparent"></i> accent</div>
  </div>
</div>

<table id="cr"></table>

<script>
addEventListener('DOMContentLoaded', () => {
  const cs = getComputedStyle(document.documentElement);
  const v = (n) => cs.getPropertyValue(n).trim();
  const lum = (h) => { const c = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255).map((x) => (x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };
  const cr = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
  const d = document.documentElement.dataset;
  document.getElementById('name').textContent = { 'night-watch': 'Night Watch', 'chart-room': 'Chart Room', signal: 'Signal' }[d.look] + ' · ' + d.scheme;
  const T = [['Ground', '--emc2-color-ground'], ['Pane', '--emc2-color-pane'], ['Panel head', '--emc2-color-panel'], ['Raised (new)', '--ux-raised'], ['Border', '--emc2-color-border'], ['Edge (new)', '--ux-edge'], ['Field border', '--emc2-color-field-border'], ['Accent soft', '--emc2-color-accent-soft'], ['Accent', '--emc2-color-accent'], ['On accent', '--emc2-color-on-accent']];
  const text = v('--emc2-color-text');
  document.getElementById('sw').innerHTML = T.map(([n, t]) => { const c = v(t); return `<div style="background:${c};color:${cr(c, text) > cr(c, v('--emc2-color-ground')) ? text : v('--emc2-color-ground')}">${n}<code>${c}</code></div>`; }).join('');
  const surf = ['--emc2-color-ground', '--emc2-color-pane', '--emc2-color-panel', '--ux-raised'].map(v);
  const min = (fg, bgs) => Math.min(...bgs.map((b) => cr(v(fg), b)));
  const R = [
    ['Text on the four surfaces', min('--emc2-color-text', surf), 4.5], ['Muted text', min('--emc2-color-muted', surf), 4.5], ['Accent as text', min('--emc2-color-accent', surf), 4.5],
    ['OK', min('--emc2-color-ok', surf), 4.5], ['Warning', min('--emc2-color-warning', surf), 4.5], ['Error', min('--emc2-color-error', surf), 4.5],
    ['On accent on accent', cr(v('--emc2-color-on-accent'), v('--emc2-color-accent')), 4.5],
    ['Text on Accent soft', cr(text, v('--emc2-color-accent-soft')), 4.5], ['Muted on Accent soft', cr(v('--emc2-color-muted'), v('--emc2-color-accent-soft')), 4.5], ['Accent on Accent soft', cr(v('--emc2-color-accent'), v('--emc2-color-accent-soft')), 4.5],
    ['Edge on ground, pane, head', min('--ux-edge', surf.slice(0, 3)), 3], ['Field border', min('--emc2-color-field-border', surf.slice(0, 3)), 3],
    ['Border (decoration)', cr(v('--emc2-color-border'), surf[1]), 0], ['Pane against ground', cr(surf[1], surf[0]), 0], ['Head against pane', cr(surf[2], surf[1]), 0],
  ];
  document.getElementById('cr').innerHTML = R.map(([n, x, need]) => `<tr><td>${n}</td><td class="n ${x < need ? 'bad' : ''}">${x.toFixed(2)}${need ? (x < need ? ' ✗ below ' + need : ' ✓') : ''}</td></tr>`).join('');
});
</script>
</body>
</html>
