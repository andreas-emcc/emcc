# Builds the emcc website (marketing/website, with its own build.mjs) and deploys it to GitHub Pages,
# served as www.emcc.dev from the public repository; the built site never enters git.
# The DMA's file (CLAUDE.md sections 3 and 4, "The website's workflow"; agents/dma.md rule 9).
#
# - Deploys from main only: the trigger names main, the jobs check the ref, and the repository's
#   github-pages environment accepts main only (the owner's setting).
# - Only GitHub's own actions, each pinned to the commit of its release (version in the comment).
# - An exact Node version; nothing installed but what marketing/website/package-lock.json names
#   (today nothing); no secrets; each job has only the permissions it needs.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "marketing/website/**"
      - "marketing/assets/screenshots/**"
      - "marketing/assets/logo/**"
      - "marketing/assets/maps/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install what the lock file names
        working-directory: marketing/website
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check the site
        working-directory: marketing/website
        run: node build.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: marketing/website/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
